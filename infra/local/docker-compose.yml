  voice-gateway:
    # D-212 (task #120): egen prosess (CLAUDE.md ufravikelig regel 5) - IKKE en rute i `api`. `JARVIS_CORE_URL` peker på
    # `api`-tjenestens container-interne adresse. D-253: EGET image (voice-gateway.Dockerfile) med lokal whisper.cpp/piper.
    # REMEDIERING DEL 1 (JARVIS-080): rå-lyd-dump er FJERNET (`JARVIS_VOICE_DEBUG_DUMP_DIR` videresendes ikke).
    # REMEDIERING DEL 2: kun talenøkler (OPENAI/DEEPGRAM/ELEVENLABS) + VAD-konfig, ingen DB-/vault-/connector-hemmeligheter.
    <<: *hardening
    build:
      context: ../..
      dockerfile: infra/local/voice-gateway.Dockerfile
    environment:
      JARVIS_CORE_URL: "http://api:${JARVIS_API_PORT:-3010}"
      # GENERERT fra infra/local/service-env.mjs (SERVICE_ENV.voice) - rediger der, ikke her.
      JARVIS_DEEPGRAM_API_KEY: "${JARVIS_DEEPGRAM_API_KEY:-}"
      JARVIS_DEEPGRAM_LANG: "${JARVIS_DEEPGRAM_LANG:-}"
      JARVIS_ELEVENLABS_API_KEY: "${JARVIS_ELEVENLABS_API_KEY:-}"
      JARVIS_ELEVENLABS_VOICE_ID: "${JARVIS_ELEVENLABS_VOICE_ID:-}"
      JARVIS_PIPER_SAMPLE_RATE: "${JARVIS_PIPER_SAMPLE_RATE:-}"
      JARVIS_VOICE_FILLER_MS: "${JARVIS_VOICE_FILLER_MS:-}"
      JARVIS_VOICE_PORT: "${JARVIS_VOICE_PORT:-3020}"
      JARVIS_VOICE_PREROLL_MS: "${JARVIS_VOICE_PREROLL_MS:-}"
      JARVIS_VOICE_SPEAK_TOOL_ACTIVITY: "${JARVIS_VOICE_SPEAK_TOOL_ACTIVITY:-}"
      JARVIS_VOICE_VAD_ADAPTIVE: "${JARVIS_VOICE_VAD_ADAPTIVE:-}"
      JARVIS_VOICE_VAD_HANGOVER_MS: "${JARVIS_VOICE_VAD_HANGOVER_MS:-}"
      JARVIS_VOICE_VAD_THRESHOLD: "${JARVIS_VOICE_VAD_THRESHOLD:-}"
      JARVIS_WHISPER_PROMPT: "${JARVIS_WHISPER_PROMPT:-}"
      JARVIS_WHISPER_THREADS: "${JARVIS_WHISPER_THREADS:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    # D-362: loopback-binding (Tailscale Serve forwarder til localhost; en ubundet 3020 kolliderte med Tailscale sin lytter).
    ports:
      - "127.0.0.1:${JARVIS_VOICE_PORT:-3020}:${JARVIS_VOICE_PORT:-3020}"
    networks: [core]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${JARVIS_VOICE_PORT:-3020}/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  browser-gateway:
    # D-339: egen prosess. REMEDIERING DEL 2 (JARVIS-008): krever tjeneste-token (JARVIS_BROWSER_GATEWAY_TOKEN_SECRET) fra
    # api/worker, kun på det private `browser`-nettverket (ingen host-port), ikke-root (`pwuser`), AKTIV Chromium-sandbox via
    # Microsofts offisielle seccomp-profil (user namespaces) i stedet for SYS_ADMIN/privileged, read-only rootfs + tmpfs.
    # Profilen er hentet fra https://github.com/microsoft/playwright/blob/main/utils/docker/seccomp_profile.json (Apache-2.0).
    build:
      context: ../..
      dockerfile: infra/local/browser-gateway.Dockerfile
    environment:
      # GENERERT fra infra/local/service-env.mjs (SERVICE_ENV.browser) - rediger der, ikke her.
      JARVIS_BROWSER_GATEWAY_PORT: "${JARVIS_BROWSER_GATEWAY_PORT:-3030}"
      JARVIS_BROWSER_GATEWAY_TOKEN_SECRET: "${JARVIS_BROWSER_GATEWAY_TOKEN_SECRET:?sett JARVIS_BROWSER_GATEWAY_TOKEN_SECRET (>= 32 tegn) i .env}"
    networks: [browser]
    cap_drop: ["ALL"]
    # D-365 (NAS-probe, ikke gjetting): Chromiums namespace-sandbox kaller chroot("/proc/self/fdinfo/") og feiler uten
    # SYS_CHROOT når `cap_drop: ALL` er satt ("Zygote process exited prematurely"). Dette er den ENESTE capabilityen som legges
    # tilbake (SYS_ADMIN/privileged er fortsatt forbudt; sjekket av ops/security/check-containment.mjs).
    cap_add: ["SYS_CHROOT"]
    security_opt:
      - "no-new-privileges:true"
      - "seccomp=./browser-gateway.seccomp.json"
    read_only: true
    tmpfs:
      - "/tmp:rw,nosuid,size=512m"
      - "/home/pwuser:rw,nosuid,uid=1000,gid=1000,size=256m"
    # REMEDIERING DEL 1 (JARVIS-008): INGEN host-publisering - kun api/worker når den via `http://browser-gateway:3030`.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:${JARVIS_BROWSER_GATEWAY_PORT:-3030}/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

networks:
  core: {}
  # Privat nettverk for nettleser-gatewayen: kun api, worker og browser-gateway. Ikke `internal` - Chromium skal nå
  # internett, men all egress går gjennom gatewayens egen allowlistede proxy (egress-proxy.ts).
  browser: {}

volumes:
  jarvis-pgdata:
