# Jarvis lokal infrastruktur.
# Alt konfigureres via miljøvariabler, ingen hardkodede maskinstier, flyttbart mellom dev-PC (RTX 4070) og
# UGREEN-NAS (D-20). Se DEPLOYMENT_STRATEGY.md.
#
# REMEDIERING DEL 1 (JARVIS-009/008/089, containment 2026-10-01):
#  - INGEN tjeneste publiserer en port på 0.0.0.0. Postgres (superbruker), Infisical, Langfuse og API er KUN
#    bundet til 127.0.0.1 (Tailscale Serve forwarder til localhost - se docs/runbooks/D250_NAS_MIGRATION.md);
#    browser-gateway publiserer ingen port.
#  - Flytende image-tagger er pinnet til tag@digest. Sammenlign mot det NAS-en faktisk kjører
#    (`docker compose images`) FØR `up --build` - se docs/remediation/BASELINE.md.
#
# REMEDIERING DEL 2 (JARVIS-008/010, 2026-10-02) - ISOLASJON:
#  - INGEN `env_file: ../../.env` lenger. Hver tjeneste får KUN variablene den trenger (`environment:`-blokkene er
#    GENERERT fra infra/local/service-env.mjs - `node ops/security/generate-compose-env.mjs`). Vault-hovednøkkel
#    (INFISICAL_ENCRYPTION_KEY/AUTH_SECRET), DB-superbruker (JARVIS_DB_ADMIN_*), NEXTAUTH/SALT og LANGFUSE_INIT_*
#    finnes KUN i infisical/langfuse/db-bootstrap/migrate/postgres - aldri i api/worker/voice-gateway/browser-gateway.
#  - EGNE DB-roller: `jarvis_runtime` (app), `infisical_app`, `langfuse_app` (opprettes av db-bootstrap, hver eier av
#    sin egen database). Ingen runtime-tjeneste kobler til som cluster-superbruker. `migrate` er en ENGANGS-jobb
#    (deploy-tid) med admin-rollen og er ikke en runtime-tjeneste.
#  - IKKE-ROOT: api/worker/migrate (`node`), voice-gateway (`node`), browser-gateway (`pwuser`) - USER i Dockerfilene;
#    read-only rootfs + tmpfs, alle capabilities droppet, no-new-privileges (x-hardening under). postgres/redis dropper
#    selv privilegier internt; infisical/langfuse er tredjeparts-images (kun no-new-privileges).
#  - NETTVERK: `core` (alt) og `browser` (KUN browser-gateway + api + worker). browser-gateway når derfor aldri
#    postgres/infisical/langfuse/redis - verken på navn eller IP. Egress fra Chromium går i tillegg gjennom en
#    allowlistet proxy inne i gatewayen (RFC1918/loopback/link-local/metadata blokkert).
#  - KODEJOBBER kjører IKKE i worker-containeren: ingen Docker-socket monteres, `JARVIS_JOB_RUNNER` er ikke satt ->
#    HVER kodejobb feiler lukket (`job_container_runner_not_configured`) til en vertsside runner finnes.
#  Strukturelt vakt: ops/security/check-containment.mjs + modules/core/test/remediation-2-compose-isolation.test.ts.
#  seccomp-profilen under refereres relativt til compose-filens mappe (Compose v2 løser stien mot prosjektmappen), så
#  `docker compose -f infra/local/docker-compose.yml ...` virker uavhengig av arbeidskatalog.

x-hardening: &hardening
  cap_drop: ["ALL"]
  security_opt: ["no-new-privileges:true"]
  read_only: true
  tmpfs: ["/tmp:rw,nosuid,size=256m"]

services:
  postgres:
    # pgvector-image gir Postgres 16 + vector-extension (aktiveres først i fase 4).
    # pgmq er bevisst utelatt: kø-valget er pg-boss-klasse over vanlige tabeller (D-13).
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      POSTGRES_DB: "${JARVIS_DB_NAME:-jarvis}"
      POSTGRES_USER: "${JARVIS_DB_ADMIN_USER:-postgres}"
      # Ingen default-passord: settes i lokal .env (git-ignorert).
      POSTGRES_PASSWORD: "${JARVIS_DB_ADMIN_PASSWORD:?sett JARVIS_DB_ADMIN_PASSWORD i .env}"
    ports:
      - "127.0.0.1:${JARVIS_DB_PORT:-5432}:5432"
    volumes:
      - jarvis-pgdata:/var/lib/postgresql/data
    networks: [core]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${JARVIS_DB_ADMIN_USER:-postgres} -d ${JARVIS_DB_NAME:-jarvis}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # D-240 + REMEDIERING DEL 2: `postgres` sin egen `POSTGRES_DB` oppretter KUN `jarvis`. Denne ene-gangs-tjenesten
  # oppretter (idempotent) de EGNE rollene `infisical_app`/`langfuse_app` og HVER SIN database med dem som eier, og
  # overleverer eierskap av en eksisterende `infisical`/`langfuse`-database fra superbrukeren (se
  # bootstrap-databases.sql). Passordene leses fra miljøet inne i psql (`\getenv`) - de står aldri i kommandolinjen.
  db-bootstrap:
    image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
    environment:
      PGPASSWORD: "${JARVIS_DB_ADMIN_PASSWORD:?sett JARVIS_DB_ADMIN_PASSWORD i .env}"
      INFISICAL_DB_PASSWORD: "${INFISICAL_DB_PASSWORD:?sett INFISICAL_DB_PASSWORD (kun a-z A-Z 0-9, minst 24 tegn) i .env}"
      LANGFUSE_DB_PASSWORD: "${LANGFUSE_DB_PASSWORD:?sett LANGFUSE_DB_PASSWORD (kun a-z A-Z 0-9, minst 24 tegn) i .env}"
    volumes:
      - ./bootstrap-databases.sql:/bootstrap/bootstrap-databases.sql:ro
    command: >
      psql -h postgres -U ${JARVIS_DB_ADMIN_USER:-postgres} -d ${JARVIS_DB_NAME:-jarvis}
      -v ON_ERROR_STOP=1 -f /bootstrap/bootstrap-databases.sql
    networks: [core]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  langfuse:
    # D-27: self-hosted Langfuse v2 (kun Postgres-avhengighet). Init-noekler
    # kommer fra .env (lokale dev-verdier) - aldri hardkodet her.
    # REMEDIERING DEL 2: kobler til som `langfuse_app` (egen rolle, eier av kun `langfuse`-databasen) - IKKE superbruker.
    image: langfuse/langfuse:2.95.11@sha256:85c278dcab96c15db94191a5c1664f85aba2d7fb6771a00e99681c902c4b7015
    environment:
      DATABASE_URL: "postgresql://langfuse_app:${LANGFUSE_DB_PASSWORD:?sett LANGFUSE_DB_PASSWORD i .env}@postgres:5432/langfuse"
      NEXTAUTH_URL: "http://127.0.0.1:3050"
      NEXTAUTH_SECRET: "${NEXTAUTH_SECRET}"
      SALT: "${SALT}"
      TELEMETRY_ENABLED: "false"
      LANGFUSE_INIT_ORG_ID: "${LANGFUSE_INIT_ORG_ID}"
      LANGFUSE_INIT_PROJECT_ID: "${LANGFUSE_INIT_PROJECT_ID}"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "${LANGFUSE_INIT_PROJECT_PUBLIC_KEY}"
      LANGFUSE_INIT_PROJECT_SECRET_KEY: "${LANGFUSE_INIT_PROJECT_SECRET_KEY}"
      LANGFUSE_INIT_USER_EMAIL: "${LANGFUSE_INIT_USER_EMAIL}"
      LANGFUSE_INIT_USER_NAME: "${LANGFUSE_INIT_USER_NAME}"
      LANGFUSE_INIT_USER_PASSWORD: "${LANGFUSE_INIT_USER_PASSWORD}"
    ports:
      - "127.0.0.1:3050:3000"
    networks: [core]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped

  infisical-redis:
    image: redis:7-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    networks: [core]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      retries: 5

  infisical:
    # D-35: self-hosted Infisical (deler Docker-Postgres via egen db 'infisical').
    # REMEDIERING DEL 2: kobler til som `infisical_app` (egen rolle, eier av kun `infisical`-databasen) - IKKE superbruker.
    # ENCRYPTION_KEY/AUTH_SECRET (vault-hovednøkkelen) finnes KUN her.
    image: infisical/infisical:latest-postgres@sha256:36438985877fb5ab99c76ee1a9c73611e44d8518b44a77304b5d4c05451f8c62
    environment:
      ENCRYPTION_KEY: "${INFISICAL_ENCRYPTION_KEY}"
      AUTH_SECRET: "${INFISICAL_AUTH_SECRET}"
      DB_CONNECTION_URI: "postgresql://infisical_app:${INFISICAL_DB_PASSWORD:?sett INFISICAL_DB_PASSWORD i .env}@postgres:5432/infisical"
      REDIS_URL: "redis://infisical-redis:6379"
      SITE_URL: "http://127.0.0.1:3060"
      TELEMETRY_ENABLED: "false"
      # D-346: uten disse kan Infisical ALDRI sende verifikasjons-/passord-gjenopprettings-e-post. Tomme .env-
      # verdier (`${VAR:-}`) er trygt no-op når Tobias ikke har fylt dem inn. Aldri en hemmelighet i selve denne filen.
      SMTP_HOST: "${INFISICAL_SMTP_HOST:-}"
      SMTP_PORT: "${INFISICAL_SMTP_PORT:-}"
      SMTP_USERNAME: "${INFISICAL_SMTP_USERNAME:-}"
      SMTP_PASSWORD: "${INFISICAL_SMTP_PASSWORD:-}"
      SMTP_FROM_ADDRESS: "${INFISICAL_SMTP_FROM_ADDRESS:-}"
      SMTP_FROM_NAME: "${INFISICAL_SMTP_FROM_NAME:-Infisical}"
    ports:
      - "127.0.0.1:3060:8080"
    networks: [core]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      db-bootstrap:
        condition: service_completed_successfully
      infisical-redis:
        condition: service_started
    restart: unless-stopped

  # One-shot migrasjoner (BO-07): kjører alle migrasjoner nøyaktig én gang før api/worker starter. restart:no -
  # avsluttet=suksess er startbetingelsen deres. Q-21: bruker ADMIN-credentials (JARVIS_DB_ADMIN_USER/PASSWORD via
  # migrate-main.ts sin adminConfigFromEnv()) - CREATE ROLE/ALTER TABLE...ENABLE RLS/CREATE EXTENSION krever
  # admin-privilegier. Bootstrapper SAMTIDIG den ekte jarvis_runtime-LOGIN-rollen api/worker skal bruke
  # (ensureRuntimeRole). REMEDIERING DEL 2: dette er en ENGANGS-jobb, IKKE en runtime-tjeneste, og den får kun
  # admin-/rolle-/identitetsvariablene (ingen connector-/modellnøkler).
  migrate:
    <<: *hardening
    build:
      context: ../..
      dockerfile: infra/local/api.Dockerfile
    command: ["node", "--experimental-transform-types", "apps/api/src/migrate-main.ts"]
    environment:
      JARVIS_DB_HOST: postgres
      JARVIS_DB_PORT: "5432"
      JARVIS_DB_NAME: "${JARVIS_DB_NAME:-jarvis}"
      # GENERERT fra infra/local/service-env.mjs (SERVICE_ENV.migrate) - rediger der, ikke her.
      JARVIS_DB_ADMIN_PASSWORD: "${JARVIS_DB_ADMIN_PASSWORD:-}"
      JARVIS_DB_ADMIN_USER: "${JARVIS_DB_ADMIN_USER:-}"
      JARVIS_DB_PASSWORD: "${JARVIS_DB_PASSWORD:-}"
      JARVIS_DB_USER: "${JARVIS_DB_USER:-}"
      JARVIS_ENV: "${JARVIS_ENV:-dev}"
      JARVIS_OWNER_NAME: "${JARVIS_OWNER_NAME:-}"
      JARVIS_OWNER_PERSON_ID: "${JARVIS_OWNER_PERSON_ID:-}"
      JARVIS_TENANT_ID: "${JARVIS_TENANT_ID:-}"
    networks: [core]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    # Q-21: bruker RUNTIME-credentials (JARVIS_DB_USER/PASSWORD via configFromEnv()) - ALDRI JARVIS_DB_ADMIN_*.
    # main.ts fail-closer ved oppstart hvis tilkoblingen skulle vise seg å være superuser/BYPASSRLS (assertRuntimeRoleSafe).
    # D-201-host-fix: LANGFUSE_BASE_URL respekterer en eksplisitt .env-verdi (Langfuse Cloud) med den container-interne
    # adressen som default.
    <<: *hardening
    build:
      context: ../..
      dockerfile: infra/local/api.Dockerfile
    environment:
      JARVIS_DB_NAME: "${JARVIS_DB_NAME:-jarvis}"
      # GENERERT fra infra/local/service-env.mjs (SERVICE_ENV.api) - rediger der, ikke her.
      JARVIS_DB_HOST: "postgres"
      JARVIS_DB_PORT: "5432"
      INFISICAL_URL: "http://infisical:8080"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
